services:
  - type: web
    name: educatec
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: SITE_ID
        value: "1"
      - key: DATABASE_URL
        sync: false