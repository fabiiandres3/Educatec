<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contraseña cambiada</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f9fa, #e9f2ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .success-card {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border-radius: 20px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #0d6efd;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
        }

        .success-card h1 {
            color: #111111;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .success-card p {
            color: #6c757d;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-login {
            background: #0d6efd;
            border: none;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: #0b5ed7;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(13, 110, 253, 0.25);
        }
    </style>
</head>

<body>

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <h1>
            ¡Contraseña cambiada!
        </h1>

        <p>
            Tu contraseña ha sido actualizada correctamente.
            Ya puedes iniciar sesión con tu nueva contraseña.
        </p>

        <a
            href="{% url 'login' %}"
            class="btn btn-login"
        >
            Iniciar sesión
        </a>

    </div>

</body>

</html>
