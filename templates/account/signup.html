<!DOCTYPE html>
<html lang="es">

<head>

    {% load static %}

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Crear cuenta - Educatec</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f9fa, #e9f2ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 30px 15px;
        }

        .signup-card {
            width: 100%;
            max-width: 550px;
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .signup-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #0d6efd;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
        }

        .signup-card h1 {
            color: #111111;
            font-size: 30px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
        }

        .signup-description {
            color: #6c757d;
            text-align: center;
            margin-bottom: 30px;
        }

        .signup-card form p {
            margin-bottom: 18px;
        }

        .signup-card form label {
            display: block;
            color: #212529;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .signup-card form input,
        .signup-card form select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #ced4da;
            border-radius: 10px;
            outline: none;
            transition: 0.2s;
        }

        .signup-card form input:focus,
        .signup-card form select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.12);
        }

        .signup-card ul.errorlist {
            color: #dc3545;
            font-size: 14px;
            padding-left: 20px;
            margin-top: 6px;
        }

        .btn-signup {
            width: 100%;
            background: #0d6efd;
            border: none;
            color: #ffffff;
            padding: 13px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-signup:hover {
            background: #0b5ed7;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(13, 110, 253, 0.25);
        }

        .login-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #0d6efd;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link:hover {
            color: #0b5ed7;
            text-decoration: underline;
        }
    </style>

</head>

<body>

    <div class="signup-card">

        <div class="signup-icon">
            👤
        </div>

        <h1>
            Crear una cuenta
        </h1>

        <p class="signup-description">
            Regístrate en Educatec y comienza a disfrutar
            de todas nuestras funcionalidades.
        </p>

        <form
            action="{% url 'account_signup' %}"
            method="POST"
        >

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-signup"
            >
                Crear cuenta
            </button>

        </form>

        <a
            href="{% url 'login' %}"
            class="login-link"
        >
            ¿Ya tienes una cuenta? Iniciar sesión
        </a>

    </div>

</body>

</html>
