{% extends 'admin/base_admin.html' %}
{% load static %}

<title>{% block page_title %}Editar Clase{% endblock %}</title>

{% block content %}

<div class="edc-pagina">

    <header class="edc-pagina__cabecera">

        <div>

            <h1 class="edc-pagina__titulo">
                <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i>
                Editar Clase
            </h1>

            <p class="edc-pagina__subtitulo">Modifica la información de la clase.</p>

        </div>

    </header>

    <div class="edc-tarjeta">

        <div class="edc-tarjeta__cabeza">
            <h2>
                <i class="fa-solid fa-chalkboard" aria-hidden="true"></i>
                Información de la clase
            </h2>
        </div>

        <form method="post">

            {% csrf_token %}

            <div class="edc-tarjeta__cuerpo">

                {{ form.non_field_errors }}
                {{ form.as_p }}

                <div class="edc-pagina__acciones">

                    <a href="{% url 'clases' %}" class="edc-btn edc-btn--secundario">
                        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                        Cancelar
                    </a>

                    <button type="submit" class="edc-btn">
                        <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
                        Guardar cambios
                    </button>

                </div>

            </div>

        </form>

    </div>

</div>

{% endblock %}
