{% extends 'admin/base_admin.html' %}
{% load static %}

{% block title %}Editar Curso{% endblock %}

{% block content %}

<style>
    .editar-curso-page {
        padding-bottom: 40px;
    }

    .curso-hero {
        background: linear-gradient(135deg, #0d6efd, #4f46e5);
        color: white;
        border-radius: 22px;
        padding: 30px 35px;
        margin-bottom: 25px;
        box-shadow: 0 12px 30px rgba(13, 110, 253, 0.18);
    }

    .curso-hero h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 800;
    }

    .curso-hero p {
        margin: 6px 0 0;
        opacity: .85;
        font-size: 14px;
    }

    .curso-card {
        background: white;
        border: 1px solid #edf0f5;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, .06);
        overflow: hidden;
    }

    .curso-card-header {
        padding: 22px 28px;
        border-bottom: 1px solid #edf0f5;
    }

    .curso-card-header h3 {
        margin: 0;
        font-size: 19px;
        font-weight: 700;
        color: #212529;
    }

    .curso-card-body {
        padding: 28px;
    }

    .curso-card-body p {
        margin-bottom: 20px;
    }

    .curso-card-body label {
        display: block;
        margin-bottom: 7px;
        font-weight: 600;
        font-size: 14px;
        color: #343a40;
    }

    .curso-card-body input,
    .curso-card-body select,
    .curso-card-body textarea {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid #dfe3e8;
        border-radius: 11px;
        outline: none;
        transition: .2s;
    }

    .curso-card-body input:focus,
    .curso-card-body select:focus,
    .curso-card-body textarea:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 4px rgba(13, 110, 253, .10);
    }

    .curso-card-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 20px 28px;
        background: #fafbfc;
        border-top: 1px solid #edf0f5;
    }

    .btn-cancelar,
    .btn-guardar {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 20px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        transition: .2s;
    }

    .btn-cancelar {
        color: #6c757d;
        background: white;
        border: 1px solid #dfe3e8;
    }

    .btn-cancelar:hover {
        background: #f1f3f5;
        color: #343a40;
    }

    .btn-guardar {
        border: none;
        color: white;
        background: linear-gradient(135deg, #0d6efd, #4f46e5);
        box-shadow: 0 6px 15px rgba(13, 110, 253, .20);
    }

    .btn-guardar:hover {
        color: white;
        transform: translateY(-1px);
        box-shadow: 0 9px 20px rgba(13, 110, 253, .28);
    }

    .errorlist {
        color: #dc3545;
        font-size: 13px;
        padding-left: 0;
        list-style: none;
    }

    @media (max-width: 768px) {
        .curso-hero {
            padding: 25px;
        }

        .curso-hero h1 {
            font-size: 25px;
        }

        .curso-card-body {
            padding: 22px;
        }

        .curso-card-footer {
            padding: 18px 22px;
            flex-direction: column-reverse;
        }

        .btn-cancelar,
        .btn-guardar {
            width: 100%;
            justify-content: center;
        }
    }
</style>

<div class="container-fluid editar-curso-page">

    <div class="curso-hero">
        <h1>
            <i class="fa-solid fa-pen-to-square"></i>
            Editar Curso
        </h1>
        <p>Modifica la información del curso.</p>
    </div>

    <div class="curso-card">

        <div class="curso-card-header">
            <h3>
                <i class="fa-solid fa-book-open"></i>
                Información del curso
            </h3>
        </div>

        <form method="post">

            {% csrf_token %}

            <div class="curso-card-body">

                {{ form.non_field_errors }}
                {{ form.as_p }}

            </div>

            <div class="curso-card-footer">

                <a href="{% url 'listar_cursos' %}" class="btn-cancelar">
                    <i class="fa-solid fa-arrow-left"></i>
                    Cancelar
                </a>

                <button type="submit" class="btn-guardar">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Guardar cambios
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
