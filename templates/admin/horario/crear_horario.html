{% extends "admin/dashboard.html" %}

{% block title %}
Crear horario
{% endblock %}

{% block content %}

<style>

    .crear-horario {
        padding: 25px;
    }

    .crear-header {
        margin-bottom: 25px;
    }

    .crear-header h2 {
        margin: 0;
        font-size: 28px;
        color: #1f2937;
    }

    .crear-header p {
        margin-top: 7px;
        color: #6b7280;
    }

    .crear-card {
        max-width: 850px;
        background: #ffffff;
        border-radius: 14px;
        padding: 25px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, .08);
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .campo {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .campo label {
        font-size: 14px;
        font-weight: 700;
        color: #374151;
    }

    .campo select {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 9px;
        background: #fff;
        color: #374151;
        font-size: 14px;
        outline: none;
    }

    .campo select:focus {
        border-color: #f39c12;
        box-shadow: 0 0 0 3px rgba(243, 156, 18, .12);
    }

    .acciones {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 25px;
    }

    .btn {
        border: none;
        border-radius: 9px;
        padding: 11px 18px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .btn-cancelar {
        background: #e5e7eb;
        color: #374151;
    }

    .btn-cancelar:hover {
        background: #d1d5db;
    }

    .btn-crear {
        background: #f39c12;
        color: #ffffff;
    }

    .btn-crear:hover {
        background: #d68910;
    }

    .info {
        max-width: 850px;
        margin-top: 18px;
        padding: 15px 18px;
        border-radius: 10px;
        background: #fff7ed;
        border: 1px solid #fed7aa;
        color: #9a3412;
        font-size: 14px;
    }

    @media (max-width: 700px) {

        .form-grid {
            grid-template-columns: 1fr;
        }

        .acciones {
            flex-direction: column;
        }

        .btn {
            justify-content: center;
        }

    }

</style>


<div class="crear-horario">

    <div class="crear-header">

        <h2>
            <i class="fas fa-calendar-plus"></i>
            Crear horario
        </h2>

        <p>
            Selecciona el período y el curso para comenzar.
        </p>

    </div>


    <div class="crear-card">

        <div class="form-grid">

            <!-- PERÍODO -->

            <div class="campo">

                <label for="periodo">
                    Período
                </label>

                <select id="periodo">

                    <option value="">
                        Seleccionar período
                    </option>

                    {% for periodo in periodos %}

                        <option value="{{ periodo.id }}">
                            {{ periodo }}
                        </option>

                    {% empty %}

                        <option value="" disabled>
                            No hay períodos registrados
                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- CURSO -->

            <div class="campo">

                <label for="curso">
                    Curso
                </label>

                <select id="curso">

                    <option value="">
                        Seleccionar curso
                    </option>

                    {% for curso in cursos %}

                        <option value="{{ curso.id }}">
                            {{ curso.nombre }}
                        </option>

                    {% empty %}

                        <option value="" disabled>
                            No hay cursos registrados
                        </option>

                    {% endfor %}

                </select>

            </div>

        </div>


        <div class="acciones">

            <a
                href="{% url 'listar_horario' %}"
                class="btn btn-cancelar"
            >
                <i class="fas fa-times"></i>
                Cancelar
            </a>

            <button
                type="button"
                id="btnCrearHorario"
                class="btn btn-crear"
            >
                <i class="fas fa-calendar-plus"></i>
                Crear horario
            </button>

        </div>

    </div>


    <div class="info">

        <i class="fas fa-info-circle"></i>

        Selecciona un período y un curso.
        Luego podrás crear el horario semanal del curso.

    </div>

</div>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const periodo =
        document.getElementById("periodo");

    const curso =
        document.getElementById("curso");

    const boton =
        document.getElementById("btnCrearHorario");


    boton.addEventListener("click", function () {

        const periodoId =
            periodo.value;

        const cursoId =
            curso.value;


        if (!periodoId) {

            alert("Selecciona un período.");

            periodo.focus();

            return;
        }


        if (!cursoId) {

            alert("Selecciona un curso.");

            curso.focus();

            return;
        }


        const urlBase =
            "{% url 'crear_horario_curso' 0 0 %}";


        const url =
            urlBase.replace(
                "0/0/",
                periodoId + "/" + cursoId + "/"
            );


        window.location.href = url;

    });

});

</script>

{% endblock %}
