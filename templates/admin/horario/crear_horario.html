{% extends "admin/dashboard.html" %}

{% block title %}
Crear horario
{% endblock %}

{% block content %}

<style>

    .crear-horario {
        padding: 25px;
    }

    .crear-header {
        margin-bottom: 25px;
    }

    .crear-header h2 {
        margin: 0;
        font-size: 28px;
        color: #1f2937;
    }

    .crear-header p {
        margin-top: 7px;
        color: #6b7280;
    }

    .crear-card {
        max-width: 850px;
        background: #ffffff;
        border-radius: 14px;
        padding: 25px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, .08);
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .campo {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .campo label {
        font-size: 14px;
        font-weight: 700;
        color: #374151;
    }

    .campo select {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 9px;
        background: #fff;
        color: #374151;
        font-size: 14px;
        outline: none;
    }

    .campo select:focus {
        border-color: #f39c12;
        box-shadow: 0 0 0 3px rgba(243, 156, 18, .12);
    }

    .acciones {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 25px;
    }

    .btn {
        border: none;
        border-radius: 9px;
        padding: 11px 18px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .btn-cancelar {
        background: #e5e7eb;
        color: #374151;
    }

    .btn-cancelar:hover {
        background: #d1d5db;
    }

    .btn-crear {
        background: #f39c12;
        color: #ffffff;
    }

    .btn-crear:hover {
        background: #d68910;
    }

    .info {
        max-width: 850px;
        margin-top: 18px;
        padding: 15px 18px;
        border-radius: 10px;
        background: #fff7ed;
        border: 1px solid #fed7aa;
        color: #9a3412;
        font-size: 14px;
    }

    /* =====================================================
       NOTIFICACIONES
       ===================================================== */

    .notificacion {
        position: fixed;
        top: 25px;
        right: 25px;
        width: min(390px, calc(100vw - 40px));
        background: #ffffff;
        border-radius: 14px;
        padding: 16px 18px;
        display: flex;
        align-items: flex-start;
        gap: 13px;
        box-shadow: 0 12px 35px rgba(0, 0, 0, .15);
        border: 1px solid #e5e7eb;
        z-index: 99999;
        transform: translateX(120%);
        opacity: 0;
        transition: .35s ease;
        overflow: hidden;
    }

    .notificacion.mostrar {
        transform: translateX(0);
        opacity: 1;
    }

    .notificacion-icono {
        width: 38px;
        height: 38px;
        min-width: 38px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
    }

    .notificacion-contenido {
        flex: 1;
        min-width: 0;
    }

    .notificacion-titulo {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 800;
        color: #1f2937;
    }

    .notificacion-mensaje {
        margin: 0;
        font-size: 13px;
        line-height: 1.45;
        color: #6b7280;
    }

    .notificacion-cerrar {
        border: none;
        background: transparent;
        color: #9ca3af;
        cursor: pointer;
        font-size: 17px;
        padding: 2px;
        line-height: 1;
    }

    .notificacion-cerrar:hover {
        color: #374151;
    }

    .notificacion.advertencia {
        border-left: 4px solid #f59e0b;
    }

    .notificacion.advertencia .notificacion-icono {
        background: #fef3c7;
        color: #d97706;
    }

    .notificacion.error {
        border-left: 4px solid #dc2626;
    }

    .notificacion.error .notificacion-icono {
        background: #fee2e2;
        color: #dc2626;
    }

    .notificacion-barra {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 3px;
        width: 100%;
        transform-origin: left;
    }

    .notificacion.advertencia .notificacion-barra {
        background: #f59e0b;
    }

    .notificacion.error .notificacion-barra {
        background: #dc2626;
    }

    @keyframes reducirBarra {
        from {
            transform: scaleX(1);
        }

        to {
            transform: scaleX(0);
        }
    }

    @media (max-width: 700px) {

        .form-grid {
            grid-template-columns: 1fr;
        }

        .acciones {
            flex-direction: column;
        }

        .btn {
            justify-content: center;
        }

    }

</style>


<div class="crear-horario">

    <div class="crear-header">

        <h2>
            <i class="fas fa-calendar-plus"></i>
            Crear horario
        </h2>

        <p>
            Selecciona el período y el curso para comenzar.
        </p>

    </div>


    <div class="crear-card">

        <div class="form-grid">

            <!-- PERÍODO -->

            <div class="campo">

                <label for="periodo">
                    Período
                </label>

                <select id="periodo">

                    <option value="">
                        Seleccionar período
                    </option>

                    {% for periodo in periodos %}

                        <option value="{{ periodo.id }}">
                            {{ periodo }}
                        </option>

                    {% empty %}

                        <option value="" disabled>
                            No hay períodos registrados
                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- CURSO -->

            <div class="campo">

                <label for="curso">
                    Curso
                </label>

                <select id="curso">

                    <option value="">
                        Seleccionar curso
                    </option>

                    {% for curso in cursos %}

                        <option value="{{ curso.id }}">
                            {{ curso.nombre }}
                        </option>

                    {% empty %}

                        <option value="" disabled>
                            No hay cursos registrados
                        </option>

                    {% endfor %}

                </select>

            </div>

        </div>


        <div class="acciones">

            <a
                href="{% url 'listar_horario' %}"
                class="btn btn-cancelar"
            >
                <i class="fas fa-times"></i>
                Cancelar
            </a>

            <button
                type="button"
                id="btnCrearHorario"
                class="btn btn-crear"
            >
                <i class="fas fa-calendar-plus"></i>
                Crear horario
            </button>

        </div>

    </div>


    <div class="info">

        <i class="fas fa-info-circle"></i>

        Selecciona un período y un curso.
        Luego podrás crear el horario semanal del curso.

    </div>

</div>


<!-- =====================================================
     NOTIFICACIÓN
     ===================================================== -->

<div
    id="notificacion"
    class="notificacion"
    role="alert"
    aria-live="polite"
>

    <div class="notificacion-icono" id="notificacionIcono">
        <i class="fas fa-exclamation-triangle"></i>
    </div>

    <div class="notificacion-contenido">

        <h4
            class="notificacion-titulo"
            id="notificacionTitulo"
        >
            Advertencia
        </h4>

        <p
            class="notificacion-mensaje"
            id="notificacionMensaje"
        >
            Mensaje
        </p>

    </div>

    <button
        type="button"
        class="notificacion-cerrar"
        id="cerrarNotificacion"
        aria-label="Cerrar notificación"
    >
        <i class="fas fa-times"></i>
    </button>

    <div
        class="notificacion-barra"
        id="notificacionBarra"
    ></div>

</div>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const periodo =
        document.getElementById("periodo");

    const curso =
        document.getElementById("curso");

    const boton =
        document.getElementById("btnCrearHorario");

    const parejasConHorario =
        {{ parejas_periodo_curso_json|safe }};

    const parejasSet = new Set(
        parejasConHorario.map(function (p) {
            return p[0] + "-" + p[1];
        })
    );


    /* ==========================================
       SISTEMA DE NOTIFICACIONES
       ========================================== */

    const notificacion =
        document.getElementById("notificacion");

    const notificacionIcono =
        document.getElementById("notificacionIcono");

    const notificacionTitulo =
        document.getElementById("notificacionTitulo");

    const notificacionMensaje =
        document.getElementById("notificacionMensaje");

    const notificacionBarra =
        document.getElementById("notificacionBarra");

    const cerrarNotificacion =
        document.getElementById("cerrarNotificacion");

    let timeoutNotificacion = null;
    let animationFrame = null;


    function mostrarNotificacion(tipo, titulo, mensaje) {

        if (timeoutNotificacion) {
            clearTimeout(timeoutNotificacion);
        }

        if (animationFrame) {
            cancelAnimationFrame(animationFrame);
        }

        notificacion.className =
            "notificacion " + tipo;

        const iconos = {
            advertencia: "fa-exclamation-triangle",
            error: "fa-times-circle",
            exito: "fa-check",
            info: "fa-info-circle"
        };

        notificacionIcono.innerHTML =
            '<i class="fas ' + (iconos[tipo] || iconos.info) + '"></i>';

        notificacionTitulo.textContent = titulo;
        notificacionMensaje.textContent = mensaje;

        notificacionBarra.style.animation = "none";
        notificacionBarra.offsetHeight;
        notificacionBarra.style.animation =
            "reducirBarra 4s linear forwards";

        notificacion.classList.add("mostrar");

        timeoutNotificacion = setTimeout(function () {
            ocultarNotificacion();
        }, 4000);
    }


    function ocultarNotificacion() {
        notificacion.classList.remove("mostrar");
    }


    cerrarNotificacion.addEventListener(
        "click",
        ocultarNotificacion
    );


    /* ==========================================
       CLICK BOTÓN CREAR HORARIO
       ========================================== */

    boton.addEventListener("click", function () {

        const periodoId =
            periodo.value;

        const cursoId =
            curso.value;


        if (!periodoId) {

            mostrarNotificacion(
                "error",
                "Falta período",
                "Selecciona un período para continuar."
            );

            periodo.focus();

            return;
        }


        if (!cursoId) {

            mostrarNotificacion(
                "error",
                "Falta curso",
                "Selecciona un curso para continuar."
            );

            curso.focus();

            return;
        }


        const clave = periodoId + "-" + cursoId;


        if (parejasSet.has(clave)) {

            mostrarNotificacion(
                "advertencia",
                "Horario ya existente",
                "Este curso ya tiene un horario creado para el período seleccionado."
            );

            return;
        }


        const urlBase =
            "{% url 'crear_horario_curso' 0 0 %}";


        const url =
            urlBase.replace(
                "0/0/",
                periodoId + "/" + cursoId + "/"
            );


        window.location.href = url;

    });

});

</script>

{% endblock %}
