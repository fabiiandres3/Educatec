{% extends 'admin/base_admin.html' %}

{% block title %}Eliminar usuario{% endblock %}

{% block content %}

<div class="edc-pagina">

    <header class="edc-pagina__cabecera">

        <div>

            <h1 class="edc-pagina__titulo">
                <i class="fa-solid fa-user-xmark" aria-hidden="true"></i>
                Eliminar usuario
            </h1>

        </div>

    </header>


    <section class="edc-tarjeta">

        <div class="edc-tarjeta__cuerpo">

            <div class="edc-alerta edc-alerta--error" role="alert">
                <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
                <div>
                    ¿Está seguro de eliminar a
                    <strong>{{ docente.first_name }} {{ docente.last_name }}</strong>?
                </div>
            </div>


            <form method="post">

                {% csrf_token %}

                <div class="edc-pagina__acciones">

                    <button type="submit" class="edc-btn edc-btn--peligro">
                        <i class="fa-solid fa-trash" aria-hidden="true"></i>
                        Eliminar
                    </button>

                    <a href="{% url 'listar_docentes' %}" class="edc-btn edc-btn--secundario">
                        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </section>

</div>

{% endblock %}
