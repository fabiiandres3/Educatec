{% extends 'paneles/alumnos/base.html' %}
{% block title %}Mis boletines{% endblock %}
{% block active_boletines %}active{% endblock %}
{% block content %}<div class="container-fluid py-3"><h2>Mis boletines</h2><form method="get" class="row g-2 mb-4"><div class="col-md-4"><select class="form-select" name="periodo"><option value="">Seleccione un periodo</option>{% for p in periodos %}<option value="{{ p.id }}" {% if periodo.id == p.id %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></div><div class="col-md-2"><button class="btn btn-primary">Consultar</button></div></form>{% if periodo %}{% include 'boletin/partials/detalle.html' %}<a class="btn btn-outline-danger" href="{% url 'descargar_boletin_pdf' alumno.id periodo.id %}">Descargar PDF</a>{% endif %}</div>
<style>
    .student-bulletins-page { --bulletin-ink:#202c43; --bulletin-muted:#78849a; --bulletin-line:#e8edf5; width:100%; max-width:1480px; margin:0 auto; padding:22px 14px 48px; color:var(--bulletin-ink); }
    .student-bulletins-page, .student-bulletins-page * { box-sizing:border-box; }
    .bulletins-hero { position:relative; overflow:hidden; display:flex; align-items:center; gap:17px; margin-bottom:19px; padding:25px 29px; border:1px solid #e3e9f4; border-radius:23px; background:radial-gradient(circle at 92% 8%,rgba(129,164,255,.18),transparent 30%),linear-gradient(120deg,#fff 0%,#f5f8ff 100%); box-shadow:0 14px 40px rgba(31,50,89,.06); }
    .bulletins-hero-icon { display:grid; flex:0 0 52px; place-items:center; width:52px; height:52px; border-radius:16px; background:#eef1ff; color:#526fe0; font-size:20px; }
    .bulletins-eyebrow { color:#526fe0; font-size:10px; font-weight:800; letter-spacing:.12em; }
    .bulletins-hero h1 { margin:5px 0 0; color:#18243b; font-size:clamp(26px,3vw,34px); font-weight:800; letter-spacing:-.04em; }
    .bulletins-hero p { margin:6px 0 0; color:var(--bulletin-muted); font-size:13px; line-height:1.55; }
    .bulletins-filter-card { display:grid; grid-template-columns:minmax(220px,.8fr) minmax(300px,1.2fr); align-items:center; gap:24px; margin-bottom:22px; padding:21px 24px; border:1px solid var(--bulletin-line); border-radius:19px; background:#fff; box-shadow:0 8px 24px rgba(31,50,89,.05); }
    .bulletins-section-heading { display:flex; align-items:center; gap:12px; min-width:0; }
    .bulletins-section-icon { display:grid; flex:0 0 40px; place-items:center; width:40px; height:40px; border-radius:13px; background:#eef1ff; color:#526fe0; }
    .bulletins-section-heading h2 { margin:0; color:#26344d; font-size:14px; font-weight:800; }
    .bulletins-section-heading p { margin:4px 0 0; color:#8792a5; font-size:11px; line-height:1.5; }
    .bulletins-filter-form { min-width:0; }
    .bulletins-filter-form label { display:block; margin-bottom:7px; color:#64718a; font-size:11px; font-weight:750; }
    .bulletins-filter-controls { display:flex; gap:9px; }
    .bulletins-filter-controls .form-select { min-width:0; min-height:43px; border-color:#e1e7f0; border-radius:11px; background-color:#fbfcfe; color:#34415a; font-size:12px; }
    .bulletins-filter-controls .form-select:focus { border-color:#8295ec; box-shadow:0 0 0 4px rgba(89,145,224,.11); }
    .bulletins-submit,.bulletins-download { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:43px; padding:0 16px; border:0; border-radius:11px; background:linear-gradient(135deg,#526fe0,#7187ed); color:#fff; font-size:12px; font-weight:750; text-decoration:none; white-space:nowrap; box-shadow:0 7px 16px rgba(83,111,224,.18); transition:transform .18s ease,box-shadow .18s ease,background .18s ease; }
    .bulletins-submit:hover,.bulletins-download:hover { transform:translateY(-1px); background:#435fcf; color:#fff; box-shadow:0 10px 20px rgba(83,111,224,.23); }
    .bulletins-report-wrap { overflow:hidden; border:1px solid var(--bulletin-line); border-radius:20px; background:#fff; box-shadow:0 10px 30px rgba(31,50,89,.055); }
    .student-bulletins-page .educatec-report { max-width:none; padding:26px; border:0; border-radius:0; }
    .student-bulletins-page .report-header { flex-wrap:wrap; gap:14px; border-bottom:2px solid #e6ebf3; }
    .student-bulletins-page .report-mark { flex:0 0 58px; width:58px; height:58px; border:0; border-radius:17px; background:linear-gradient(145deg,#526fe0,#82afef); color:#fff; }
    .student-bulletins-page .report-school { color:#26344d; font-size:17px; }
    .student-bulletins-page .report-school-subtitle { color:#8792a5; }
    .student-bulletins-page .report-title { min-width:180px; }
    .student-bulletins-page .report-title h1 { color:#202c43; font-size:clamp(20px,2.5vw,26px); letter-spacing:-.03em; }
    .student-bulletins-page .report-title p { color:#78849a; font-size:12px; }
    .student-bulletins-page .student-data { overflow:hidden; gap:0; border:1px solid var(--bulletin-line); border-radius:14px; background:#fafbfe; }
    .student-bulletins-page .student-data div { min-width:0; border-color:#edf0f6; color:#47556d; font-size:12px; overflow-wrap:anywhere; }
    .student-bulletins-page .student-data b { color:#738097; }
    .student-bulletins-page .table-responsive { border:1px solid #e8edf4; border-radius:14px; -webkit-overflow-scrolling:touch; }
    .student-bulletins-page .report-table { min-width:680px; }
    .student-bulletins-page .report-table th { background:#f5f7fc; color:#7b8798; font-size:10px; letter-spacing:.06em; }
    .student-bulletins-page .report-table td { border-color:#edf0f6; color:#536078; font-size:12px; line-height:1.55; }
    .student-bulletins-page .report-table tbody tr:not(.report-observation):hover { background:#fafbff; }
    .student-bulletins-page .report-table td strong { color:#354158; }
    .student-bulletins-page .report-observation td { background:#fafbfe; color:#69758b; font-size:11px; }
    .student-bulletins-page .report-summary { grid-template-columns:repeat(2,minmax(0,1fr)) minmax(220px,1.5fr); gap:12px; }
    .student-bulletins-page .report-summary > div { border:1px solid var(--bulletin-line); border-radius:14px; background:#fbfcfe; color:#69758b; }
    .student-bulletins-page .report-summary span { color:#7b8798; }
    .student-bulletins-page .report-summary strong { color:#526fe0; }
    .student-bulletins-page .report-scale { font-size:11px; }
    .bulletins-actions { display:flex; justify-content:flex-end; margin-top:15px; }
    .bulletins-filter-label { display:block; margin-bottom:7px; color:#64718a; font-size:11px; font-weight:750; }
    .bulletins-filter-controls .form-select { flex:1 1 0; }
    .bulletins-periods { margin:0 0 22px; }
    .bulletins-periods-heading { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:0 2px 13px; }
    .bulletins-periods-heading h2 { margin:4px 0 0; color:#26344d; font-size:18px; font-weight:800; }
    .bulletins-year-chip { padding:6px 10px; border:1px solid #e4e9f2; border-radius:999px; background:#f7f8fc; color:#6e7b91; font-size:11px; font-weight:750; }
    .bulletins-period-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr)); gap:13px; }
    .bulletin-period-card { min-width:0; padding:17px; border:1px solid var(--bulletin-line); border-radius:17px; background:#fff; box-shadow:0 8px 23px rgba(31,50,89,.045); }
    .bulletin-period-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:9px; }
    .bulletin-period-card h3 { margin:0; color:#29354c; font-size:14px; font-weight:800; }
    .bulletin-status { display:inline-flex; flex:0 0 auto; padding:5px 9px; border-radius:999px; font-size:9px; font-weight:800; }
    .bulletin-status-published { background:#e8f7ef; color:#218257; }
    .bulletin-status-pending { background:#fff4df; color:#966412; }
    .bulletin-status-empty { background:#f0f2f6; color:#69758b; }
    .bulletin-period-stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:15px; }
    .bulletin-period-stats > div { min-width:0; padding:9px; border:1px solid #edf0f6; border-radius:11px; background:#fafbfe; }
    .bulletin-period-stats span,.bulletins-selected-stats span { display:block; color:#8490a3; font-size:9px; line-height:1.35; }
    .bulletin-period-stats strong,.bulletins-selected-stats strong { display:block; margin-top:5px; color:#344fc1; font-size:15px; font-weight:850; overflow-wrap:anywhere; }
    .bulletin-period-actions { display:flex; align-items:center; gap:8px; margin-top:14px; }
    .bulletins-period-view,.bulletins-period-pdf { display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:39px; padding:0 12px; border-radius:10px; font-size:11px; font-weight:800; text-decoration:none; }
    .bulletins-period-view { flex:1; background:#eef1ff; color:#526fe0; }
    .bulletins-period-view:hover { background:#dfe5ff; color:#435fcf; }
    .bulletins-period-pdf { border:1px solid #e4e9f2; background:#fff; color:#c54747; }
    .bulletins-period-pdf:hover { border-color:#efcaca; background:#fff6f6; color:#ad3438; }
    .bulletin-period-note { margin:14px 0 0; color:#8792a5; font-size:11px; line-height:1.45; }
    .bulletins-no-periods { padding:22px; border:1px dashed var(--bulletin-line); border-radius:15px; color:#8792a5; text-align:center; font-size:12px; }
    .bulletins-selected-summary { display:flex; align-items:center; justify-content:space-between; gap:18px; margin:0 0 14px; padding:15px 18px; border:1px solid var(--bulletin-line); border-radius:16px; background:#fff; box-shadow:0 7px 20px rgba(31,50,89,.04); }
    .bulletins-selected-heading { display:flex; align-items:center; gap:11px; min-width:0; }
    .bulletins-selected-heading .bulletins-section-icon { flex:0 0 38px; width:38px; height:38px; }
    .bulletins-selected-heading strong,.bulletins-selected-heading small { display:block; }
    .bulletins-selected-heading strong { color:#29354c; font-size:12px; }
    .bulletins-selected-heading small { margin-top:4px; color:#8792a5; font-size:10px; }
    .bulletins-selected-stats { display:grid; grid-template-columns:repeat(3,minmax(85px,1fr)); gap:8px; }
    .bulletins-selected-stats > div { min-width:0; padding:8px 10px; border-left:1px solid #edf0f6; }
    .bulletins-selected-stats strong { font-size:13px; }
    @media(max-width:800px) { .bulletins-filter-card { grid-template-columns:1fr; gap:17px; } .student-bulletins-page .report-summary { grid-template-columns:repeat(2,minmax(0,1fr)); } .student-bulletins-page .report-scale { grid-column:1/-1; } .bulletins-selected-summary { align-items:stretch; flex-direction:column; } .bulletins-selected-stats > div:first-child { border-left:0; } }
    @media(max-width:600px) {
        .student-bulletins-page { padding:16px 10px 105px; }
        .bulletins-hero { align-items:flex-start; padding:20px 17px; border-radius:20px; }
        .bulletins-hero-icon { flex-basis:42px; width:42px; height:42px; border-radius:13px; font-size:17px; }
        .bulletins-hero p { font-size:12px; }
        .bulletins-filter-card { padding:17px; border-radius:17px; }
        .bulletins-filter-controls { flex-direction:column; }
        .bulletins-filter-controls .form-select,.bulletins-submit { width:100%; }
        .bulletins-filter-controls .form-select { min-height:46px; }
        .bulletins-periods-heading { align-items:flex-start; }
        .bulletins-periods-heading h2 { font-size:16px; }
        .bulletins-period-grid { grid-template-columns:minmax(0,1fr); gap:10px; }
        .bulletin-period-card { padding:15px; }
        .bulletins-selected-summary { padding:14px; }
        .bulletins-selected-stats { grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; }
        .bulletins-selected-stats > div { padding:7px 6px; }
        .bulletins-selected-stats span { font-size:8px; }
        .bulletins-report-wrap { border-radius:16px; }
        .student-bulletins-page .educatec-report { padding:16px 13px; }
        .student-bulletins-page .report-header { align-items:flex-start; }
        .student-bulletins-page .report-title { width:100%; margin:0; text-align:left; }
        .student-bulletins-page .student-data,.student-bulletins-page .report-summary { grid-template-columns:1fr; }
        .student-bulletins-page .report-scale { grid-column:auto; }
        .student-bulletins-page .report-summary { gap:9px; }
        .bulletins-actions { display:block; }
        .bulletins-download { width:100%; }
    }
    @media(prefers-reduced-motion:reduce) { .bulletins-submit,.bulletins-download { transition:none; } }

    /* Modo oscuro de los boletines del alumno. */
    html[data-theme="dark"] .student-bulletins-page { --bulletin-ink:#e8efff; --bulletin-muted:#adbbd2; --bulletin-line:rgba(167,190,238,.16); color:#e8efff; }
    html[data-theme="dark"] .bulletins-hero {
        border-color:rgba(167,190,238,.18);
        background:radial-gradient(ellipse at 86% 0%,rgba(103,137,231,.24),transparent 36%),linear-gradient(118deg,#101d36,#172b4f 64%,#1c3a66);
        box-shadow:0 14px 36px rgba(0,0,0,.22);
    }
    html[data-theme="dark"] .bulletins-hero-icon,
    html[data-theme="dark"] .bulletins-section-icon { background:#25385f; color:#d1dcff; }
    html[data-theme="dark"] .bulletins-eyebrow { color:#c4d1ff; }
    html[data-theme="dark"] .bulletins-hero h1 { color:#edf3ff; }
    html[data-theme="dark"] .bulletins-hero p,
    html[data-theme="dark"] .bulletins-section-heading p { color:#b5c3d9; }
    html[data-theme="dark"] .bulletins-filter-card,
    html[data-theme="dark"] .bulletins-report-wrap,
    html[data-theme="dark"] .bulletin-period-card,
    html[data-theme="dark"] .bulletins-selected-summary {
        border-color:rgba(167,190,238,.16);
        background:#111d30;
        color:#e5edf9;
        box-shadow:0 10px 28px rgba(0,0,0,.2);
    }
    html[data-theme="dark"] .bulletins-section-heading h2 { color:#e8efff; }
    html[data-theme="dark"] .bulletins-periods-heading h2,
    html[data-theme="dark"] .bulletin-period-card h3,
    html[data-theme="dark"] .bulletins-selected-heading strong { color:#e8efff; }
    html[data-theme="dark"] .bulletins-filter-label { color:#bdc9dc; }
    html[data-theme="dark"] .bulletins-year-chip { border-color:#34445d; background:#172743; color:#bdc9dc; }
    html[data-theme="dark"] .bulletin-period-stats > div { border-color:#2c3b52; background:#0e1a2b; }
    html[data-theme="dark"] .bulletin-period-stats span,
    html[data-theme="dark"] .bulletins-selected-stats span,
    html[data-theme="dark"] .bulletins-selected-heading small,
    html[data-theme="dark"] .bulletin-period-note,
    html[data-theme="dark"] .bulletins-no-periods { color:#aab9d0; }
    html[data-theme="dark"] .bulletin-period-stats strong,
    html[data-theme="dark"] .bulletins-selected-stats strong { color:#cbd5ff; }
    html[data-theme="dark"] .bulletin-status-published { background:#173a2c; color:#a8ebc1; }
    html[data-theme="dark"] .bulletin-status-pending { background:#3a301a; color:#f5d58b; }
    html[data-theme="dark"] .bulletin-status-empty { background:#263246; color:#c0ccdc; }
    html[data-theme="dark"] .bulletins-period-view { background:#25385f; color:#d1dcff; }
    html[data-theme="dark"] .bulletins-period-view:hover { background:#304879; color:#fff; }
    html[data-theme="dark"] .bulletins-period-pdf { border-color:#4a3c4a; background:#251d2a; color:#ffb4b6; }
    html[data-theme="dark"] .bulletins-selected-stats > div { border-color:#34445d; }
    html[data-theme="dark"] .bulletins-filter-form label { color:#bdc9dc; }
    html[data-theme="dark"] .bulletins-filter-controls .form-select {
        border-color:#40516c;
        background-color:#0c1728;
        color:#e5edf9;
        color-scheme:dark;
    }
    html[data-theme="dark"] .bulletins-filter-controls .form-select:focus { border-color:#8095eb; box-shadow:0 0 0 4px rgba(89,145,224,.18); }
    html[data-theme="dark"] .student-bulletins-page .educatec-report { border-color:rgba(167,190,238,.15); background:#101b2d !important; color:#dbe6f5; }
    html[data-theme="dark"] .student-bulletins-page .report-header { border-bottom-color:#34445d; }
    html[data-theme="dark"] .student-bulletins-page .report-mark { border-color:#7287d9; background:#24365d; color:#e5ebff; }
    html[data-theme="dark"] .student-bulletins-page .report-school,
    html[data-theme="dark"] .student-bulletins-page .report-title h1 { color:#e8efff; }
    html[data-theme="dark"] .student-bulletins-page .report-school-subtitle,
    html[data-theme="dark"] .student-bulletins-page .report-title p { color:#aebdd3; }
    html[data-theme="dark"] .student-bulletins-page .student-data { border-color:#34445d; background:#121f33; }
    html[data-theme="dark"] .student-bulletins-page .student-data div { border-color:#2c3b52; color:#d1dced; }
    html[data-theme="dark"] .student-bulletins-page .student-data b { color:#aebdd3; }
    html[data-theme="dark"] .student-bulletins-page .table-responsive { border-color:#34445d; }
    html[data-theme="dark"] .student-bulletins-page .report-table th { border-color:#40516c; background:#1b3154; color:#dbe6ff; }
    html[data-theme="dark"] .student-bulletins-page .report-table td { border-color:#2c3b52; background:#101b2d; color:#cbd7e8; }
    html[data-theme="dark"] .student-bulletins-page .report-table tbody tr:not(.report-observation):hover td { background:#192944; }
    html[data-theme="dark"] .student-bulletins-page .report-table td strong { color:#edf3ff; }
    html[data-theme="dark"] .student-bulletins-page .report-observation td { background:#142239; color:#b9c7dc; }
    html[data-theme="dark"] .student-bulletins-page .report-summary > div { border-color:#34445d; background:#142239; color:#c3d0e2; }
    html[data-theme="dark"] .student-bulletins-page .report-summary span,
    html[data-theme="dark"] .student-bulletins-page .report-scale { color:#b9c7dc; }
    html[data-theme="dark"] .student-bulletins-page .report-summary strong { color:#cbd5ff; }
</style>
{% endblock %}
