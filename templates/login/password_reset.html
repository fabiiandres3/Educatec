<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Recuperar contraseña | Educatec</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f9fa, #e9f2ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .reset-card {
            width: 100%;
            max-width: 470px;
            background: #ffffff;
            border-radius: 20px;
            padding: 45px 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .reset-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #0d6efd;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        .reset-card h1 {
            color: #111111;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
        }

        .description {
            color: #6c757d;
            text-align: center;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .reset-card form p {
            margin-bottom: 18px;
        }

        .reset-card form label {
            display: block;
            color: #212529;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .reset-card form input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ced4da;
            border-radius: 10px;
            outline: none;
            transition: 0.2s;
        }

        .reset-card form input:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.12);
        }

        .reset-card ul.errorlist {
            color: #dc3545;
            font-size: 14px;
            padding-left: 20px;
            margin-top: 6px;
        }

        .btn-reset {
            width: 100%;
            background: #0d6efd;
            border: none;
            color: #ffffff;
            padding: 13px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            margin-top: 8px;
            transition: 0.3s;
        }

        .btn-reset:hover {
            background: #0b5ed7;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(13, 110, 253, 0.25);
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #0d6efd;
            font-weight: 600;
            text-decoration: none;
        }

        .back-login:hover {
            color: #0b5ed7;
            text-decoration: underline;
        }

        @media (max-width: 576px) {
            .reset-card {
                padding: 35px 22px;
            }

            .reset-card h1 {
                font-size: 24px;
            }
        }
    </style>

</head>

<body>

    <div class="reset-card">

        <div class="text-center">

            <div class="reset-icon">
                🔑
            </div>

            <h1>
                Recuperar contraseña
            </h1>

            <p class="description">
                Introduce el correo electrónico asociado
                a tu cuenta y te enviaremos un enlace
                para restablecer tu contraseña.
            </p>

        </div>

        <form
            method="POST"
            action="{% url 'password_reset' %}"
        >

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn-reset"
            >
                Enviar enlace de recuperación
            </button>

        </form>

        <a
            href="{% url 'login' %}"
            class="back-login"
        >
            ← Volver al inicio de sesión
        </a>

    </div>

</body>

</html>
