<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nueva contraseña | Educatec</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f9fa, #e9f2ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .password-card {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 20px;
            padding: 45px 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .password-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #0d6efd;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        .password-card h1 {
            color: #111111;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
        }

        .description {
            color: #6c757d;
            text-align: center;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .password-card form p {
            margin-bottom: 18px;
        }

        .password-card form label {
            display: block;
            color: #212529;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .password-card form input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ced4da;
            border-radius: 10px;
            outline: none;
            transition: 0.2s;
        }

        .password-card form input:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.12);
        }

        .password-card ul.errorlist {
            color: #dc3545;
            font-size: 14px;
            padding-left: 20px;
            margin-top: 6px;
        }

        .btn-password {
            width: 100%;
            background: #0d6efd;
            border: none;
            color: #ffffff;
            padding: 13px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-password:hover {
            background: #0b5ed7;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(13, 110, 253, 0.25);
        }

        .invalid-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #212529;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
        }

        .invalid-card {
            text-align: center;
        }

        .invalid-card h2 {
            color: #111111;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .invalid-card p {
            color: #6c757d;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-new-link {
            display: inline-block;
            background: #0d6efd;
            color: #ffffff;
            padding: 12px 25px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-new-link:hover {
            background: #0b5ed7;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(13, 110, 253, 0.25);
        }

        @media (max-width: 576px) {
            .password-card {
                padding: 35px 22px;
            }

            .password-card h1 {
                font-size: 24px;
            }
        }
    </style>

</head>

<body>

    <div class="password-card">

        {% if validlink %}

            <div class="text-center">

                <div class="password-icon">
                    🔒
                </div>

                <h1>
                    Crear nueva contraseña
                </h1>

                <p class="description">
                    Introduce tu nueva contraseña para recuperar
                    el acceso a tu cuenta.
                </p>

            </div>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="btn-password"
                >
                    Cambiar contraseña
                </button>

            </form>

        {% else %}

            <div class="invalid-card">

                <div class="invalid-icon">
                    !
                </div>

                <h2>
                    Enlace inválido
                </h2>

                <p>
                    Este enlace de recuperación ya fue utilizado
                    o ha expirado.
                </p>

                <a
                    href="{% url 'password_reset' %}"
                    class="btn-new-link"
                >
                    Solicitar un nuevo enlace
                </a>

            </div>

        {% endif %}

    </div>

</body>

</html>
