<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Correo enviado | Educatec</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f9fa, #e9f2ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .email-card {
            width: 100%;
            max-width: 470px;
            background: #ffffff;
            border-radius: 20px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .email-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #0d6efd;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        .email-card h1 {
            color: #111111;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .email-card p {
            color: #6c757d;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .spam-message {
            font-size: 14px !important;
            margin-bottom: 30px !important;
        }

        .btn-login {
            display: inline-block;
            background: #0d6efd;
            border: none;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: #0b5ed7;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(13, 110, 253, 0.25);
        }

        @media (max-width: 576px) {
            .email-card {
                padding: 35px 22px;
            }

            .email-card h1 {
                font-size: 24px;
            }
        }
    </style>

</head>

<body>

    <div class="email-card">

        <div class="email-icon">
            ✉
        </div>

        <h1>
            Revisa tu correo
        </h1>

        <p>
            Si existe una cuenta asociada a ese correo electrónico,
            recibirás un enlace para restablecer tu contraseña.
        </p>

        <p class="spam-message">
            Revisa también la carpeta de spam o correo no deseado.
        </p>

        <a
            href="{% url 'login' %}"
            class="btn-login"
        >
            Volver al inicio de sesión
        </a>

    </div>

</body>

</html>
