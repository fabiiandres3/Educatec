<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Crear cuenta | Educatec</title>

    {% load static %}

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f9fa, #e9f2ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .register-card {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .register-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #0d6efd;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
        }

        .register-card h1 {
            color: #111111;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .register-description {
            color: #6c757d;
            text-align: center;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .register-card form p {
            margin-bottom: 17px;
        }

        .register-card form label {
            display: block;
            color: #212529;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .register-card form input,
        .register-card form select,
        .register-card form textarea {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #ced4da;
            border-radius: 10px;
            outline: none;
            transition: 0.2s;
        }

        .register-card form input:focus,
        .register-card form select:focus,
        .register-card form textarea:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.12);
        }

        .register-card form input[type="checkbox"] {
            width: auto;
            margin-right: 7px;
        }

        .register-card ul.errorlist {
            color: #dc3545;
            font-size: 14px;
            padding-left: 20px;
            margin-top: 6px;
            margin-bottom: 5px;
        }

        .btn-register {
            width: 100%;
            background: #0d6efd;
            border: none;
            color: #ffffff;
            padding: 13px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-register:hover {
            background: #0b5ed7;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(13, 110, 253, 0.25);
        }

        .login-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #0d6efd;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link:hover {
            color: #0b5ed7;
            text-decoration: underline;
        }

        @media (max-width: 576px) {
            .register-card {
                padding: 32px 22px;
            }

            .register-card h1 {
                font-size: 24px;
            }
        }
    </style>

</head>

<body>

    <div class="register-card">

        <div class="register-icon">
            👤
        </div>

        <h1>
            Crear una cuenta
        </h1>

        <p class="register-description">
            Completa tus datos para registrarte en Educatec.
        </p>

        <form
            action="{% url 'registrar_usuario' %}"
            method="POST"
        >

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn-register"
            >
                Crear cuenta
            </button>

        </form>

        <a
            href="{% url 'login' %}"
            class="login-link"
        >
            ¿Ya tienes una cuenta? Iniciar sesión
        </a>

    </div>

</body>

</html>
