{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Educatec -
        {% block title %}
            Portal Estudiantil
        {% endblock %}
    </title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet"
    >


    <!-- CSS DEL PANEL ALUMNOS -->

    <link
        rel="stylesheet"
        href="{% static 'css/paneles/dashboard_alumnos.css' %}"
    >


    {% block extra_css %}
    {% endblock %}


    <!-- =====================================================
         ESTILO CERRAR SESIÓN
    ====================================================== -->

    <style>

        .logout-item {
            margin-top: 10px;
            padding: 0 !important;
        }


        .logout-item form {
            margin: 0;
            padding: 0;
            width: 100%;
        }


        .logout-button {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: inherit;

            display: flex;
            align-items: center;

            gap: 12px;

            padding: 12px 18px;

            margin: 0;

            font-family: inherit;
            font-size: inherit;
            font-weight: inherit;

            text-align: left;

            cursor: pointer;

            transition:
                background-color 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }


        .logout-button i {
            width: 20px;
            min-width: 20px;

            text-align: center;

            font-size: 16px;
        }


        .logout-button span {
            display: inline-block;
        }


        /*
         * Hover
         */

        .logout-button:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: #ff5c5c;
        }


        /*
         * Icono al pasar el mouse
         */

        .logout-button:hover i {
            color: #ff5c5c;
        }


        /*
         * Efecto de presión
         */

        .logout-button:active {
            transform: scale(0.98);
        }


        /*
         * Evita el borde azul del navegador
         */

        .logout-button:focus {
            outline: none;
            box-shadow: none;
        }


        .logout-button:focus-visible {
            outline: 2px solid rgba(255, 92, 92, 0.5);
            outline-offset: -2px;
        }

    </style>

    <style>

    .logout-item {
        margin: 0 !important;
        padding: 0 !important;
        width: 100%;
        list-style: none;
    }

    .logout-item form {
        width: 100%;
        margin: 0;
        padding: 0;
    }

    .logout-button {
        width: 100%;
        height: auto;

        margin: 0 !important;
        padding: 12px 18px !important;

        border: none;
        outline: none;

        background: transparent;
        color: inherit;

        display: flex;
        align-items: center;
        gap: 12px;

        font-family: inherit;
        font-size: inherit;
        font-weight: inherit;

        text-align: left;

        cursor: pointer;

        box-sizing: border-box;

        transition:
            background-color 0.2s ease,
            color 0.2s ease;
    }

    .logout-button i {
        width: 20px;
        min-width: 20px;

        margin: 0;
        padding: 0;

        text-align: center;
    }

    .logout-button span {
        margin: 0;
        padding: 0;
    }

    .logout-button:hover {
        background-color: rgba(255, 255, 255, 0.08);
        color: #ff5c5c;
    }

    .logout-button:hover i {
        color: #ff5c5c;
    }

    .logout-button:focus,
    .logout-button:active {
        outline: none;
        box-shadow: none;
    }

</style>


<style>
    /* CERRAR SESIÓN */
    .sidebar .menu .logout-item {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        display: block !important;
    }

    .sidebar .menu .logout-item form {
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    .sidebar .menu .logout-item .logout-button {
        /* Mismo espacio que un li normal */
        width: 100% !important;
        margin: 0 !important;
        padding: 12px 18px !important;

        /* Quitar apariencia de botón */
        border: 0 !important;
        outline: 0 !important;
        background: transparent !important;

        /* Misma alineación */
        display: flex !important;
        align-items: center !important;
        justify-content: flex-start !important;

        /* Misma separación */
        gap: 12px !important;

        /* Texto */
        text-align: left !important;
        font-family: inherit !important;
        font-size: inherit !important;
        font-weight: inherit !important;
        line-height: normal !important;

        color: inherit !important;

        box-sizing: border-box !important;

        cursor: pointer;
    }

    .sidebar .menu .logout-item .logout-button i {
        width: 20px !important;
        min-width: 20px !important;
        margin: 0 !important;
        padding: 0 !important;
        text-align: center !important;
    }

    .sidebar .menu .logout-item .logout-button span {
        margin: 0 !important;
        padding: 0 !important;
    }

    .sidebar .menu .logout-item .logout-button:hover {
        background: rgba(255, 255, 255, 0.08) !important;
        color: #ff5c5c !important;
    }

    .sidebar .menu .logout-item .logout-button:hover i {
        color: #ff5c5c !important;
    }
</style>

</head>


<body>

<div class="wrapper">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar">


        <!-- =================================================
             LOGO
        ================================================== -->

        <div class="logo">

            <i class="fa-solid fa-graduation-cap"></i>

            <span>
                Educatec
            </span>

        </div>


        <!-- =================================================
             MENÚ
        ================================================== -->

        <ul class="menu">


            <!-- =================================================
                 INICIO
            ================================================== -->

            <li
                class="{% block active_inicio %}{% endblock %}"
                onclick="window.location='{% url 'dashboard_alumnos' %}'"
            >

                <i class="fa-solid fa-house"></i>

                <span>
                    Inicio
                </span>

            </li>


            <!-- =================================================
                 MATERIAS
            ================================================== -->

            <!--

            <li
                class="{% block active_materias %}{% endblock %}"
                onclick="window.location='{% url 'materias_alumnos' %}'"
            >

                <i class="fa-solid fa-book-open"></i>

                <span>
                    Materias
                </span>

            </li>

            -->


            <!-- =================================================
                 TAREAS
            ================================================== -->

            <li
                onclick="window.location.href='{% url "listar_tareas_alumno" %}'"
            >

                <i class="fa-solid fa-book-open"></i>

                <span>
                    Tareas
                </span>

            </li>


            <!-- =================================================
                 CALIFICACIONES
            ================================================== -->

            <li
                class="{% block active_calificaciones %}{% endblock %}"
                onclick="window.location='{% url 'calificaciones_alumnos' %}'"
            >

                <i class="fa-solid fa-chart-column"></i>

                <span>
                    Calificaciones
                </span>

            </li>


            <!-- =================================================
                 ASISTENCIA
            ================================================== 

            <li
                class="{% block active_asistencia %}{% endblock %}"
                onclick="window.location='{% url 'asistencia_alumnos' %}'"
            >

                <i class="fa-solid fa-calendar-check"></i>

                <span>
                    Asistencia
                </span>

            </li>-->


            <!-- =================================================
                 EVENTOS
            ================================================== -->

            <li
                class="{% block active_eventos %}{% endblock %}"
                onclick="window.location='{% url 'listar_eventos_alumno' %}'"
            >

                <i class="fa-solid fa-calendar-days"></i>

                <span>
                    Eventos
                </span>

            </li>


            <!-- =================================================
                 LOGROS
            ================================================== -->

            <!--

            <li
                class="{% block active_logros %}{% endblock %}"
                onclick="window.location='{% url 'logros_alumnos' %}'"
            >

                <i class="fa-solid fa-trophy"></i>

                <span>
                    Logros
                </span>

            </li>

            -->


            <!-- =================================================
                 CONFIGURACIÓN
            ================================================== -->

            <li
                class="{% block active_configuracion %}{% endblock %}"
                onclick="window.location='{% url 'configuracion_alumnos' %}'"
            >

                <i class="fa-solid fa-gear"></i>

                <span>
                    Configuración
                </span>

            </li>


            <!-- =================================================
                 CERRAR SESIÓN
            ================================================== -->

            <li class="logout-item">

            <li id="logoutBtn" onclick="cerrarSesion()">
                <i class="fa-solid fa-right-from-bracket"></i>
                Cerrar Sesión
            </li>

        </li>

        </ul>


    </aside>


    <!-- =====================================================
         CONTENIDO PRINCIPAL
    ====================================================== -->

    <main class="content">

        {% block content %}
        {% endblock %}

    </main>


</div>


<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script
    src="{% static 'js/paneles/dashboard_alumnos.js' %}"
></script>

<script>
    function cerrarSesion() {
        fetch("{% url 'cerrar_sesion' %}", {
            method: "POST",
            headers: {
                "X-CSRFToken": "{{ csrf_token }}",
                "X-Requested-With": "XMLHttpRequest"
            }
        })
        .then(response => {
            if (response.ok) {
                window.location.href = "{% url 'login' %}";
            } else {
                window.location.reload();
            }
        })
        .catch(error => {
            console.error("Error al cerrar sesión:", error);
        });
    }
</script>


{% block extra_js %}
{% endblock %}


</body>

</html>
