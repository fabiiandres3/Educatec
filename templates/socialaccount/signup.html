{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completa tu registro | Educatec</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height:100vh; background:linear-gradient(135deg,#f8f9fa,#e9f2ff); display:flex; align-items:center; justify-content:center; font-family:Arial,sans-serif; padding:20px; }
        .register-card { width:100%; max-width:520px; background:#fff; border-radius:20px; padding:40px 35px; box-shadow:0 15px 40px rgba(0,0,0,.12); }
        .register-icon { width:75px; height:75px; margin:0 auto 20px; border-radius:50%; background:#0d6efd; color:#fff; display:flex; align-items:center; justify-content:center; font-size:34px; }
        h1 { color:#111; font-size:28px; font-weight:700; text-align:center; margin-bottom:8px; }
        .register-description { color:#6c757d; text-align:center; font-size:15px; margin-bottom:30px; }
        form p { margin-bottom:17px; } form label { display:block; color:#212529; font-weight:600; margin-bottom:7px; }
        form input, form select { width:100%; padding:11px 13px; border:1px solid #ced4da; border-radius:10px; outline:none; }
        form input:focus, form select:focus { border-color:#0d6efd; box-shadow:0 0 0 3px rgba(13,110,253,.12); }
        ul.errorlist { color:#dc3545; font-size:14px; padding-left:20px; margin-top:6px; }
        .btn-register { width:100%; background:#0d6efd; border:0; color:#fff; padding:13px; border-radius:10px; font-weight:600; font-size:16px; margin-top:10px; }
        .login-link { display:block; text-align:center; margin-top:22px; color:#0d6efd; font-weight:600; text-decoration:none; }
        @media(max-width:576px) { .register-card { padding:32px 22px; } h1 { font-size:24px; } }
    </style>
</head>
<body>
    <main class="register-card">
        <div class="register-icon" aria-hidden="true">👤</div>
        <h1>Completa tu registro</h1>
        <p class="register-description">Confirma tus datos para crear tu cuenta en Educatec con Google.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-register">Crear cuenta</button>
        </form>
        <a href="{% url 'login' %}" class="login-link">Volver al inicio de sesión</a>
    </main>
    <script src="{% static 'js/csrf_refresh.js' %}"></script>
</body>
</html>
